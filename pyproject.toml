[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-health-report"
version = "1.0.0"
description = "Read-only Oracle Database health and security report (HTML/JSON) using python-oracledb thin mode"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alii" }]
requires-python = ">=3.10"
dependencies = ["oracledb>=2.5", "jinja2>=3.1.6"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Systems Administration",
  "Topic :: Database",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "bandit>=1.7"]

[project.scripts]
oracle-health-report = "oracle_health_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.j2", "*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs a real Oracle Database (OHR_INTEGRATION=1)"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "PLR2004", "PLR0913", "PLR0917", "PLC0415", "S603", "S607"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
